let importData={inv:null,sales:null,exp:null};

function previewImport(type, input){
  const file=input.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    const rows=parseCSV(e.target.result);
    importData[type]=rows;
    const lbl=document.getElementById('lbl-'+type);
    if(lbl){lbl.textContent=`✓ ${file.name} — ${rows.length-1} rows ready`;lbl.style.color='var(--accent3)';}
  };
  reader.readAsText(file);
}

function parseCSV(text){
  // Normalize line endings
  const lines=text.replace(/\r\n/g,'\n').replace(/\r/g,'\n').trim().split('\n');
  return lines.map(line=>{
    const cols=[]; let cur=''; let inQ=false;
    for(let i=0;i<line.length;i++){
      const ch=line[i];
      if(ch==='"'){
        if(inQ&&line[i+1]==='"'){cur+='"';i++;} // escaped quote
        else inQ=!inQ;
      } else if(ch===','&&!inQ){
        cols.push(cur.trim()); cur='';
      } else {
        cur+=ch;
      }
    }
    cols.push(cur.trim());
    return cols;
  });
}

// Robust number cleaner — handles UGX 1,200,000 / "1,200,000" / 1200000
function cleanNum(v){
  if(v===null||v===undefined||v==='') return 0;
  const s=String(v).replace(/[^0-9.-]/g,''); // strip everything except digits, dot, minus
  return parseFloat(s)||0;
}

async function processImport(){
  let added=0;

  // INVENTORY: Product Name | Qty Purchased | Buying Price | Selling Price | Purchase Date | Purchase Month
  if(importData.inv){
    const rows=importData.inv.slice(1);
    for(const r of rows){
      if(!r[0]||!r[0].trim()) continue;
      const row={id:uid(),name:r[0]?.trim()||'',qty:cleanNum(r[1]),buyingPrice:cleanNum(r[2]),sellingPrice:cleanNum(r[3]),date:r[4]?.trim()||now(),purchaseMonth:r[5]?.trim()||''};
      if(!row.purchaseMonth) row.purchaseMonth=monthLabel(row.date);
      inv.push(row); added++;
      await dbInsert('inventory',{id:row.id,name:row.name,qty:row.qty,buying_price:row.buyingPrice,selling_price:row.sellingPrice,date:row.date,purchase_month:row.purchaseMonth});
    }
    LS.set('biz_inv',inv);
  }

  // SALES: Date | Product Sold | Qty Sold | Selling Price | Discount/unit | Total Sale | Month | Payment Method | Amount Paid | Change
  if(importData.sales){
    const rows=importData.sales.slice(1);
    for(const r of rows){
      if(!r[1]||!r[1].trim()) continue;
      const row={
        id:uid(),
        date:r[0]?.trim()||now(),
        product:r[1]?.trim()||'',
        qtySold:cleanNum(r[2]),
        sellingPrice:cleanNum(r[3]),
        discount:cleanNum(r[4]),
        totalSale:cleanNum(r[5]),
        // r[6] = Month — skip
        paymentMethod:r[7]?.trim()||'Cash',
        amountPaid:cleanNum(r[8]),
        change:cleanNum(r[9]),
        recordedBy:'import'
      };
      if(!row.totalSale&&row.sellingPrice&&row.qtySold) row.totalSale=(row.sellingPrice-row.discount)*row.qtySold;
      if(!row.sellingPrice&&row.totalSale&&row.qtySold) row.sellingPrice=Math.round(row.totalSale/row.qtySold);
      sales.push(row); added++;
      await dbInsert('sales',{id:row.id,date:row.date,product:row.product,qty_sold:row.qtySold,selling_price:row.sellingPrice,discount:row.discount,total_sale:row.totalSale,payment_method:row.paymentMethod,amount_paid:row.amountPaid,change:row.change,recorded_by:row.recordedBy});
    }
    LS.set('biz_sales',sales);
  }

  // EXPENSES: Date | Category | Description | Amount | Month
  if(importData.exp){
    const rows=importData.exp.slice(1);
    for(const r of rows){
      if(!r[2]||!r[2].trim()) continue;
      const row={id:uid(),date:r[0]?.trim()||now(),category:r[1]?.trim()||'Other',description:r[2]?.trim()||'',amount:cleanNum(r[3])};
      exp.push(row); added++;
      await dbInsert('expenses',{id:row.id,date:row.date,category:row.category,description:row.description,amount:row.amount});
    }
    LS.set('biz_exp',exp);
  }

  importData={inv:null,sales:null,exp:null};
  closeModal(); render();
  showToast(`Imported ${added} records successfully!`);
}

let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;if(!localStorage.getItem('pwa_dismissed'))setTimeout(()=>document.getElementById('pwa-banner').classList.add('show'),3000)});
function triggerInstall(){document.getElementById('pwa-banner').classList.remove('show');if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.then(r=>{if(r.outcome==='accepted')showToast('TRAXXO installed!');deferredPrompt=null;});}else showIOSGuide();}
function dismissInstall(){document.getElementById('pwa-banner').classList.remove('show');localStorage.setItem('pwa_dismissed','1')}
window.addEventListener('appinstalled',()=>{document.getElementById('pwa-banner').classList.remove('show');showToast('Added to home screen!')});
function showIOSGuide(){openModal('Add to Home Screen',`<div style="display:flex;flex-direction:column;gap:12px">${[['1','Tap the Share button','Box with arrow at Safari bottom'],['2','Tap "Add to Home Screen"','Scroll down in share menu'],['3','Tap "Add"','TRAXXO appears on your home screen']].map(([n,t,d])=>`<div style="display:flex;gap:12px;background:var(--surface2);border-radius:10px;padding:13px"><div style="width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0">${n}</div><div><div style="font-weight:600;font-size:13px">${t}</div><div style="font-size:12px;color:var(--text2);margin-top:2px">${d}</div></div></div>`).join('')}</div>`,closeModal);document.getElementById('modal-ok').textContent='Got it!';}
(function(){const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);if(isIOS&&!window.navigator.standalone&&!localStorage.getItem('pwa_dismissed')){setTimeout(()=>{const b=document.getElementById('pwa-banner');b.querySelector('.pwa-banner-text strong').textContent='Install TRAXXO';b.querySelector('.pwa-banner-text span').textContent='Tap to install on iPhone';b.querySelector('[onclick="triggerInstall()"]').onclick=showIOSGuide;b.classList.add('show');},3500);}})();

document.getElementById('date-chip').textContent=new Date().toLocaleDateString('en-UG',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
const bizName=LS.val('biz_name','TRAXXO');
document.getElementById('login-biz-name').textContent=bizName;

// SPLASH
(function(){
  const prog=document.getElementById('splash-progress'); const splash=document.getElementById('splash');
  let w=0; const iv=setInterval(()=>{w=Math.min(w+Math.random()*25,95);prog.style.width=w+'%'},150);
  const done=()=>{clearInterval(iv);prog.style.width='100%';setTimeout(()=>{splash.classList.add('hide');setTimeout(()=>{if(splash.parentNode)splash.remove()},500)},300)};
  window.addEventListener('load',done); setTimeout(done,2200);
})();

// ── RETURNS (Basic) ──────────────────────────────────────────
var returns = JSON.parse(localStorage.getItem('biz_returns')||'[]');
function saveReturns(){ localStorage.setItem('biz_returns', JSON.stringify(returns)); }

function calcRetAmount(){
  var qtyEl = document.getElementById('ret-qty');
  var amtEl = document.getElementById('ret-amount');
  var unitEl = document.getElementById('ret-unit-price');
  if(!qtyEl||!amtEl||!unitEl) return;
  var q = parseInt(qtyEl.value)||0;
  var unit = parseFloat(unitEl.value)||0;
  amtEl.value = Math.round(q*unit);
}

function processReturn(saleId){
  var sale = sales.find(function(s){ return String(s.id)===String(saleId); });
  if(!sale){ showToast('Sale not found','#f87171'); return; }
  var cur = localStorage.getItem('biz_currency')||'UGX';
  var fmt2 = function(n){ return cur+' '+Math.round(n).toLocaleString('en-US'); };
  var totalRet = returns.filter(function(r){ return String(r.saleId)===String(saleId); }).reduce(function(t,r){ return t+r.returnAmount; },0);
  var maxReturn = sale.totalSale - totalRet;
  if(maxReturn<=0){ showToast('Already fully returned','#f87171'); return; }
  var unitPrice = sale.qtySold>0 ? sale.totalSale/sale.qtySold : 0;

  openModal('Process Return',
    '<input type="hidden" id="ret-unit-price" value="'+unitPrice+'">'+
    '<div style="background:var(--surface2);border-radius:12px;padding:14px;margin-bottom:16px">'+
      '<div style="display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px">'+
        '<span style="color:var(--text3)">Product</span><span style="font-weight:600">'+sale.product+'</span>'+
        '<span style="color:var(--text3)">Customer</span><span>'+(sale.customer||'—')+'</span>'+
        '<span style="color:var(--text3)">Sold Qty</span><span style="font-weight:600">'+sale.qtySold+' units</span>'+
        '<span style="color:var(--text3)">Sale Total</span><span>'+fmt2(sale.totalSale)+'</span>'+
      '</div>'+
    '</div>'+
    '<div class="modal-field"><label>Returning Qty *</label>'+
      '<input type="number" id="ret-qty" placeholder="e.g. 5" min="1" max="'+sale.qtySold+'" oninput="calcRetAmount()">'+
      '<div style="font-size:11px;color:var(--text3);margin-top:4px">Unit price: '+fmt2(unitPrice)+' · Max: '+sale.qtySold+'</div>'+
    '</div>'+
    '<div class="modal-field"><label>Return Amount</label>'+
      '<input type="number" id="ret-amount" placeholder="Auto-calculated">'+
      '<div style="font-size:11px;color:var(--text3);margin-top:4px">Max refundable: '+fmt2(maxReturn)+'</div>'+
    '</div>'+
    '<div class="modal-field"><label>Reason *</label>'+
      '<select id="ret-reason">'+
        '<option value="Wrong size">Wrong size</option>'+
        '<option value="Defective item">Defective item</option>'+
        '<option value="Wrong item">Wrong item</option>'+
        '<option value="Customer changed mind">Customer changed mind</option>'+
        '<option value="Other">Other</option>'+
      '</select>'+
    '</div>'+
    '<div class="modal-field"><label>Refund Type *</label>'+
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px">'+
        '<label style="display:flex;align-items:center;gap:6px;cursor:pointer;flex:1;min-width:80px;background:var(--surface2);border:1px solid var(--border2);border-radius:10px;padding:10px;font-size:13px">'+
          '<input type="radio" name="ret-method" value="cash" checked style="accent-color:var(--accent)"> Cash</label>'+
        '<label style="display:flex;align-items:center;gap:6px;cursor:pointer;flex:1;min-width:80px;background:var(--surface2);border:1px solid var(--border2);border-radius:10px;padding:10px;font-size:13px">'+
          '<input type="radio" name="ret-method" value="exchange" style="accent-color:var(--accent)"> Exchange</label>'+
        '<label style="display:flex;align-items:center;gap:6px;cursor:pointer;flex:1;min-width:80px;background:var(--surface2);border:1px solid var(--border2);border-radius:10px;padding:10px;font-size:13px">'+
          '<input type="radio" name="ret-method" value="credit" style="accent-color:var(--accent)"> Store Credit</label>'+
      '</div>'+
    '</div>'+
    '<div class="modal-field"><label>Notes <span style="color:var(--text3);font-weight:400">(Optional)</span></label>'+
      '<input id="ret-note" placeholder="Any additional details...">'+
    '</div>',
    function(){
      var qty = parseInt(document.getElementById('ret-qty').value)||0;
      var amount = parseFloat(document.getElementById('ret-amount').value)||Math.round(qty*unitPrice);
      var reason = document.getElementById('ret-reason').value;
      var methodEl = document.querySelector('input[name="ret-method"]:checked');
      var method = methodEl ? methodEl.value : 'cash';
      var note = document.getElementById('ret-note').value.trim();
      if(qty<=0){ showToast('Enter returning quantity','#f87171'); return; }
      if(qty>sale.qtySold){ showToast('Cannot exceed sold qty of '+sale.qtySold,'#f87171'); return; }
      if(amount>maxReturn){ showToast('Amount exceeds max refundable','#f87171'); return; }
      var ret = {
        id:'ret_'+Date.now(), saleId:String(sale.id), product:sale.product,
        customer:sale.customer||'', originalQty:sale.qtySold, originalAmount:sale.totalSale,
        returnQty:qty, returnAmount:amount, method:method, reason:reason, note:note,
        date:new Date().toISOString().slice(0,10)
      };
      returns.push(ret); saveReturns();
      var allInv = JSON.parse(localStorage.getItem('biz_inv')||'[]');
      var invItem = allInv.find(function(i){ return i.name.toLowerCase()===sale.product.toLowerCase(); });
      if(invItem){ invItem.qty=(+invItem.qty||0)+qty; localStorage.setItem('biz_inv',JSON.stringify(allInv)); }
      render();
      var ml = method==='cash'?'Cash refund':method==='exchange'?'Exchange':'Store credit';
      showToast('Return processed — '+fmt2(amount)+' ('+ml+')');
    }
  );
}

</script>
